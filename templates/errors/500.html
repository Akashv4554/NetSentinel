{% extends 'base.html' %}
{% block title %}500{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card p-5 text-center">
      <div class="display-5 text-danger mb-3"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i></div>
      <h1 class="h3">System Error</h1>
      <p class="text-muted">The interface could not complete the request. Please retry or review the application logs.</p>
      <div><a class="btn btn-primary" href="{{ url_for('ui.dashboard') }}">Return to Dashboard</a></div>
    </div>
  </div>
</div>
{% endblock %}
