<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NetSentinel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
  </head>
  <body class="bg-light">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0">
            <div class="card-body p-5">
              <h1 class="display-5 fw-bold text-primary">{{ title }}</h1>
              <p class="lead text-muted">{{ subtitle }}</p>
              <p class="mb-4">
                This project skeleton is now wired with Flask, SQLAlchemy,
                Blueprints, logging, and a placeholder home page.
              </p>
              <p class="text-muted mb-4">
                Current scan records: {{ scan_count }}
              </p>
              <a href="https://flask.palletsprojects.com/" class="btn btn-primary">
                Learn more about Flask
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
